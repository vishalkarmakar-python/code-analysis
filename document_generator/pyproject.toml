[project]
name = "document-generator"
version = "0.1.0"
description = "Project for generating specification documents from ABAP code and specification template in SAP development."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=0.3.25",
    "langchain-community>=0.3.24",
    "langchain-ollama>=0.3.3",
    "pandas>=2.2.3",
    "psycopg2>=2.9.10",
    "pydantic-settings>=2.9.1",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.24",
    "streamlit>=1.45.1",
    "unstructured>=0.17.2",
]

[dependency-groups]
dev = ["ipykernel>=6.29.5", "ruff>=0.11.12"]
