[project]
name = "code-analysis"
version = "0.1.0"
description = "Python Application for ABAP Code Analysis using Artificial Intelligence"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=0.3.26",
    "langchain-community>=0.3.27",
    "langchain-core>=0.3.70",
    "langchain-ollama>=0.3.5",
    "pandas>=2.3.1",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "tiktoken>=0.9.0",
    "tqdm>=4.67.1",
    "transformers>=4.53.3",
]

[dependency-groups]
dev = ["ruff>=0.12.4"]
